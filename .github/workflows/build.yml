name: Build Custom Admin APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and Build Android App
        run: |
          TARGET_DIR=$(find . -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            echo "Found Android project in: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurnstileCustomAdmin.apk
          path: "**/app/build/outputs/apk/debug/*.apk"
